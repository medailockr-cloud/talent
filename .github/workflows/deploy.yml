name: Node.js CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./talent-backend

    strategy:
      matrix:
        node-version: [18.x]

    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: './talent-backend/package-lock.json'
        
    - run: npm ci
    - run: npx prisma generate
    
    # Run Automated Tests
    - run: npm test
    
    # In a real enterprise app, you would add steps here to build Docker image
    # and deploy to AWS ECS / EKS or Google Cloud Run.
